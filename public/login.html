<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Bookstore IMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>BookStore <span>IMS</span></h2>
            <p>Sign in to access the Management Portal</p>
        </div>

        <div id="auth-error" class="auth-error" style="display: none;"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Staff Email Address</label>
                <input type="email" id="email" required placeholder="staff@bookstore.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In to Portal</button>
        </form>

        <div class="auth-footer">
            Need a staff account? <a href="/register.html">Create an account</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('auth-error');
            errorBox.style.display = 'none';

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();
            if (!res.ok) {
                errorBox.textContent = data.error;
                errorBox.style.display = 'block';
                return;
            }

            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
