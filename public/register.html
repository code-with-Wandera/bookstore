<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Bookstore IMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>BookStore <span>IMS</span></h2>
            <p>Create a Staff Management Account</p>
        </div>

        <div id="auth-error" class="auth-error" style="display: none;"></div>

        <form id="register-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="full-name" required placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="jane@bookstore.com">
            </div>
            <div class="form-group">
                <label>Staff Role</label>
                <select id="role">
                    <option value="Admin">Store Manager / Admin</option>
                    <option value="Cashier">Sales Cashier</option>
                </select>
            </div>
            <div class="form-group">
                <label>Password (min. 6 characters)</label>
                <input type="password" id="password" minlength="6" required placeholder="Create a secure password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" minlength="6" required placeholder="Re-enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account & Enter</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login.html">Sign in here</a>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('auth-error');
            errorBox.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.style.display = 'block';
                return;
            }

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    full_name: document.getElementById('full-name').value,
                    email: document.getElementById('email').value,
                    role: document.getElementById('role').value,
                    password
                })
            });

            const data = await res.json();
            if (!res.ok) {
                errorBox.textContent = data.error;
                errorBox.style.display = 'block';
                return;
            }

            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
